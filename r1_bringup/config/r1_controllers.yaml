controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    wheel_separation: 0.13
    wheel_radius: 0.024
    publish_rate: 50.0
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    enable_odom_tf: true
    use_stamped_vel: false
    cmd_vel_topic: "/cmd_vel"
    # ==========================================
    # ⚠️ 核心缺失部分：加速度与速度限制
    # ==========================================
    # 线性速度限制 (前进/后退)
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.2          # 最大线速度 (m/s)，限制最高速
    linear.x.min_velocity: -0.2         # 最小线速度
    #linear.x.max_acceleration: 0.05      # 最大线加速度 (m/s^2)，越小越平缓
    
    # 角速度限制 (转向)
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 0.5         # 最大角速度 (rad/s)
    angular.z.min_velocity: -0.5
    angular.z.max_acceleration: 0.2     # 最大角加速度 (rad/s^2)，越小转向越平缓